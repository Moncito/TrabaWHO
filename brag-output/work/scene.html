<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Every frame is a pure function of t (seconds). All randomness is seeded and precomputed.
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, F = 1100;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = 'Bahnschrift, "Segoe UI", Arial';

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(11);
const rr = (a, b) => a + (b - a) * R();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eo = x => 1 - Math.pow(1 - x, 3);

// ---------- camera ----------
let cam = { d: 0, x: 0, y: 0 };
function setCam(t) {
  let d;
  if (t < 3) d = lerp(4200, 1500, eo(t / 3));
  else if (t < 7) d = lerp(1500, 1380, (t - 3) / 4);
  else d = lerp(1380, 1560, ss(7, 9.6, t));
  cam = { d, x: 40 * Math.sin(t * 0.5), y: 20 * Math.sin(t * 0.37) - 10 };
}
function proj(x, y, z) {
  const dz = z + cam.d; if (dz < 30) return null;
  const s = F / dz; return { x: CX + (x - cam.x) * s, y: CY + (y - cam.y) * s, s, dz };
}

// ---------- sprites ----------
function sprite(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const fogSpr = sprite(256, [[0, 'rgba(150,165,195,1)'], [.35, 'rgba(140,155,185,.55)'], [.7, 'rgba(120,135,165,.15)'], [1, 'rgba(120,135,165,0)']]);
const glowW = sprite(256, [[0, 'rgba(255,250,235,1)'], [.15, 'rgba(255,225,160,.7)'], [.45, 'rgba(255,170,70,.18)'], [1, 'rgba(255,150,50,0)']]);
const glowB = sprite(128, [[0, 'rgba(200,220,255,1)'], [.3, 'rgba(160,190,255,.35)'], [1, 'rgba(120,160,255,0)']]);
const grain = [0, 1, 2, 3].map(i => {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'), im = g.createImageData(512, 512), r = rng(100 + i);
  for (let p = 0; p < im.data.length; p += 4) { const v = r() * 255; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});

// ---------- fog + particles ----------
const fog = Array.from({ length: 46 }, () => ({ x: rr(-1700, 1700), y: rr(-800, 800), z: rr(-3300, 2600), r: rr(600, 1300), a: rr(.06, .14), ph: rr(0, 6.28) }));
const dust = Array.from({ length: 750 }, () => ({ x: rr(-2600, 2600), y: rr(-1500, 1500), z: rr(-4000, 2800), r: rr(1.5, 5), gold: R() < .22, ph: rr(0, 6.28), sp: rr(.5, 1.5) }));

// ---------- logo (icosahedron) ----------
const LR = 380, PHI = (1 + Math.sqrt(5)) / 2;
const IV = [[-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0], [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI], [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]]
  .map(v => { const l = Math.hypot(...v); return v.map(c => c / l * LR); });
const IF = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
const IE = []; { const seen = new Set(); IF.forEach(f => [[f[0], f[1]], [f[1], f[2]], [f[2], f[0]]].forEach(([a, b]) => { const k = Math.min(a, b) + '_' + Math.max(a, b); if (!seen.has(k)) { seen.add(k); IE.push([a, b]); } })); }
function rotXYZ(v, ax, ay, az) {
  let [x, y, z] = v, c, s, t;
  c = Math.cos(ax); s = Math.sin(ax); t = y * c - z * s; z = y * s + z * c; y = t;
  c = Math.cos(ay); s = Math.sin(ay); t = x * c + z * s; z = -x * s + z * c; x = t;
  c = Math.cos(az); s = Math.sin(az); t = x * c - y * s; y = x * s + y * c; x = t;
  return [x, y, z];
}
const logoRot = (v, t) => rotXYZ(v, 0.42 + 0.08 * Math.sin(t * 0.4), t * 0.55 + 0.3, 0.12);
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const L = norm([-0.35, -0.55, -0.76]);
const SUBN = 8;
const bary = (a, b, c, i, j) => [0, 1, 2].map(k => a[k] + (b[k] - a[k]) * i / SUBN + (c[k] - a[k]) * j / SUBN);

// ---------- text ----------
let TXT; // {fs, xs[], ws[], top, bot, width}
function layoutText() {
  ctx.font = `700 100px ${FONT}`;
  const ws = [...'NOVA'].map(ch => ctx.measureText(ch).width), gap = 22, raw = ws.reduce((a, b) => a + b) + gap * 3;
  const sc = 1500 / raw, fs = 100 * sc;
  ctx.font = `700 ${fs}px ${FONT}`;
  const m = ctx.measureText('N'), cap = m.actualBoundingBoxAscent;
  const w2 = [...'NOVA'].map(ch => ctx.measureText(ch).width), g2 = gap * sc, tot = w2.reduce((a, b) => a + b) + g2 * 3;
  let x = -tot / 2; const xs = w2.map(w => { const r = x; x += w + g2; return r; });
  TXT = { fs, xs, ws: w2, top: -cap / 2, bot: cap / 2, width: tot };
}
function textPath(g) { // world coords, origin at text centre
  g.font = `700 ${TXT.fs}px ${FONT}`; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  [...'NOVA'].forEach((ch, i) => g.fillText(ch, TXT.xs[i], TXT.bot));
}

// ---------- shards ----------
let SH = [], SPK = [];
function buildShards() {
  // target cells tiled over the word
  const MW = 1700, MH = Math.ceil(TXT.bot - TXT.top + 160);
  const mc = document.createElement('canvas'); mc.width = MW; mc.height = MH; const mg = mc.getContext('2d');
  mg.translate(MW / 2, MH / 2); mg.fillStyle = '#fff'; textPath(mg);
  const md = mg.getImageData(0, 0, MW, MH).data, C = 16, tg = [];
  for (let y = TXT.top - 8; y < TXT.bot + 8; y += C) for (let x = -TXT.width / 2 - 8; x < TXT.width / 2 + 8; x += C) {
    const px = Math.round(x + C / 2 + MW / 2), py = Math.round(y + C / 2 + MH / 2);
    if (px < 0 || py < 0 || px >= MW || py >= MH || md[(py * MW + px) * 4 + 3] < 128) continue;
    const q = [[x, y], [x + C, y], [x + C, y + C], [x, y + C]], flip = R() < .5;
    const tris = flip ? [[q[0], q[1], q[2]], [q[0], q[2], q[3]]] : [[q[0], q[1], q[3]], [q[1], q[2], q[3]]];
    tris.forEach(tr => { const cx = (tr[0][0] + tr[1][0] + tr[2][0]) / 3, cy = (tr[0][1] + tr[1][1] + tr[2][1]) / 3; tg.push({ cx, cy, off: tr.map(p => [p[0] - cx, p[1] - cy, 0]) }); });
  }
  // source sub-triangles of the logo at the moment it shatters (t = 3)
  const src = [];
  IF.forEach(f => {
    const [a, b, c] = f.map(i => logoRot(IV[i], 3));
    for (let i = 0; i < SUBN; i++) for (let j = 0; i + j < SUBN; j++) {
      const add = (p, q, r) => { const ce = [0, 1, 2].map(k => (p[k] + q[k] + r[k]) / 3); src.push({ ce, off: [p, q, r].map(v => sub(v, ce).map(u => u * .9)) }); };
      add(bary(a, b, c, i, j), bary(a, b, c, i + 1, j), bary(a, b, c, i, j + 1));
      if (i + j < SUBN - 1) add(bary(a, b, c, i + 1, j), bary(a, b, c, i + 1, j + 1), bary(a, b, c, i, j + 1));
    }
  });
  src.sort((p, q) => p.ce[0] - q.ce[0]);
  tg.sort((p, q) => p.cx - q.cx);
  SH = tg.map((tt, j) => {
    const s = src[Math.floor(j * src.length / tg.length)];
    const p0 = s.ce.map(v => v + rr(-12, 12)), dir = norm(p0.map((v, k) => v + rr(-150, 150)));
    const sp = rr(200, 760);
    const v = [dir[0] * sp, dir[1] * sp * .85, clamp(dir[2] * sp + rr(-250, 150), -380, 900)];
    return { p0, v, spin: [rr(-7, 7), rr(-7, 7), rr(-5, 5)], tx: tt.cx, ty: tt.cy, so: s.off, to: tt.off,
      delay: (tt.cx + TXT.width / 2) / TXT.width * 0.85 + rr(0, .3), bulge: rr(-1, 1) };
  });
  SPK = Array.from({ length: 280 }, () => { const d = norm([rr(-1, 1), rr(-1, 1), rr(-1, 1)]); return { d, sp: rr(700, 1900), life: rr(.5, 1.5), w: rr(1, 2.6) }; });
}

const RAMP = [[0, [36, 22, 6]], [.45, [160, 108, 32]], [.72, [236, 194, 104]], [.9, [255, 236, 180]], [1, [255, 252, 238]]];
function ramp(x) {
  x = clamp(x); let i = 0; while (i < RAMP.length - 2 && x > RAMP[i + 1][0]) i++;
  const [a, ca] = RAMP[i], [b, cb] = RAMP[i + 1], k = (x - a) / (b - a);
  return `rgb(${ca.map((c, n) => Math.round(lerp(c, cb[n], k))).join(',')})`;
}

// ---------- draw passes ----------
function drawFog(t, near) {
  const m = lerp(1, .38, ss(2.6, 5, t));
  const list = fog.filter(f => near ? f.z <= 0 : f.z > 0).map(f => ({ f, p: proj(f.x + 60 * Math.sin(t * .2 + f.ph), f.y + 25 * Math.cos(t * .15 + f.ph), f.z) })).filter(o => o.p).sort((a, b) => b.p.dz - a.p.dz);
  list.forEach(({ f, p }) => {
    const a = f.a * m * ss(120, 1100, p.dz) * (1 - ss(3800, 6000, p.dz)); if (a < .003) return;
    const r = f.r * p.s; ctx.globalAlpha = a; ctx.drawImage(fogSpr, p.x - r, p.y - r, r * 2, r * 2);
  });
  ctx.globalAlpha = 1;
}
function drawDust(t, near) {
  ctx.globalCompositeOperation = 'lighter';
  dust.forEach(d => {
    if (near !== (d.z <= 0)) return;
    const p = proj(d.x + 30 * Math.sin(t * .3 + d.ph), d.y - t * 14 * d.sp, d.z); if (!p) return;
    const tw = .55 + .45 * Math.sin(t * 2.2 * d.sp + d.ph);
    const a = tw * ss(60, 500, p.dz) * (1 - ss(5000, 7000, p.dz)) * (d.gold ? .8 : .55);
    const r = Math.max(.6, d.r * p.s);
    ctx.globalAlpha = a;
    if (r > 2.2) { const g = d.gold ? glowW : glowB, R2 = r * 4; ctx.drawImage(g, p.x - R2, p.y - R2, R2 * 2, R2 * 2); }
    else { ctx.fillStyle = d.gold ? '#ffd890' : '#cfe0ff'; ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r); }
  });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawLogo(t) {
  const build = ss(2.3, 3.0, t);
  const jit = build * build * 6, jx = jit * Math.sin(t * 91), jy = jit * Math.cos(t * 77);
  const c = proj(jx, jy, 0); if (!c) return;
  // halo + core
  ctx.globalCompositeOperation = 'lighter';
  const pulse = .75 + .25 * Math.sin(t * 3.1) + build * .9;
  let r = LR * 2.6 * c.s; ctx.globalAlpha = .22 * pulse; ctx.drawImage(glowW, c.x - r, c.y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const V = IV.map(v => { const w = logoRot(v, t); return { w, p: proj(w[0] + jx, w[1] + jy, w[2]) }; });
  if (V.some(v => !v.p)) return;
  // faces: translucent dark glass with gold lighting
  const faces = IF.map(f => { const [a, b, cc] = f.map(i => V[i].w), n = norm(cross(sub(b, a), sub(cc, a))); return { f, n, z: (a[2] + b[2] + cc[2]) / 3 }; }).sort((a, b) => b.z - a.z);
  faces.forEach(({ f, n }) => {
    const lit = Math.abs(dot(n, L)), front = n[2] < 0;
    ctx.beginPath(); f.forEach((i, k) => k ? ctx.lineTo(V[i].p.x, V[i].p.y) : ctx.moveTo(V[i].p.x, V[i].p.y)); ctx.closePath();
    ctx.fillStyle = front ? `rgba(${Math.round(18 + lit * 90)},${Math.round(22 + lit * 62)},${Math.round(40 + lit * 30)},.62)` : 'rgba(10,14,26,.35)';
    ctx.fill();
  });
  // inner core seen through glass
  ctx.globalCompositeOperation = 'lighter';
  r = LR * .9 * c.s * (1 + build * .25); ctx.globalAlpha = .55 * pulse; ctx.drawImage(glowW, c.x - r, c.y - r, r * 2, r * 2);
  // fracture lines (shard boundaries) light up before the break
  if (build > 0) {
    ctx.lineWidth = 1.1; ctx.strokeStyle = `rgba(255,226,160,${.75 * build})`; ctx.beginPath();
    faces.forEach(({ f, n }) => {
      if (n[2] > 0) return; const [a, b, cc] = f.map(i => V[i].w);
      const P = (i, j) => { const w = bary(a, b, cc, i, j); return proj(w[0] + jx, w[1] + jy, w[2]); };
      for (let i = 1; i < SUBN; i++) {
        [[P(i, 0), P(0, i)], [P(i, 0), P(i, SUBN - i)], [P(0, i), P(SUBN - i, i)]].forEach(([p, q]) => { ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); });
      }
    });
    ctx.stroke();
  }
  // glowing edges
  ctx.shadowColor = 'rgba(255,190,90,.9)'; ctx.shadowBlur = 18;
  IE.forEach(([a, b]) => {
    const za = V[a].w[2] + V[b].w[2], front = za < 0;
    ctx.strokeStyle = `rgba(255,${front ? 226 : 200},${front ? 160 : 130},${front ? .95 : .3})`;
    ctx.lineWidth = (front ? 2.6 : 1.4) * c.s * 1.4;
    ctx.beginPath(); ctx.moveTo(V[a].p.x, V[a].p.y); ctx.lineTo(V[b].p.x, V[b].p.y); ctx.stroke();
  });
  ctx.shadowBlur = 0;
  V.forEach(v => { const rr2 = (v.w[2] < 0 ? 22 : 10) * v.p.s; ctx.globalAlpha = v.w[2] < 0 ? .9 : .35; ctx.drawImage(glowW, v.p.x - rr2, v.p.y - rr2, rr2 * 2, rr2 * 2); });
  // orbit ring
  ctx.globalAlpha = .5; ctx.strokeStyle = 'rgba(255,215,150,.7)'; ctx.lineWidth = 1.3; ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const a = i / 120 * Math.PI * 2, w = rotXYZ([Math.cos(a) * LR * 1.5, 0, Math.sin(a) * LR * 1.5], 1.2, t * .2, -.35), p = proj(w[0] + jx, w[1] + jy, w[2]);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.stroke();
  const ba = t * 1.3, bw = rotXYZ([Math.cos(ba) * LR * 1.5, 0, Math.sin(ba) * LR * 1.5], 1.2, t * .2, -.35), bp = proj(bw[0] + jx, bw[1] + jy, bw[2]);
  r = 40 * bp.s; ctx.globalAlpha = .95; ctx.drawImage(glowW, bp.x - r, bp.y - r, r * 2, r * 2);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawBurst(t) {
  const u = (t - 3);
  if (u < 0 || u > 1.8) return;
  const c = proj(0, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  // flash
  const fl = 1 - ss(0, .5, u); let r = LR * (2.2 + u * 3) * c.s;
  ctx.globalAlpha = fl; ctx.drawImage(glowW, c.x - r, c.y - r, r * 2, r * 2);
  ctx.globalAlpha = fl * .25; ctx.fillStyle = '#ffe9c2'; ctx.fillRect(0, 0, W, H);
  // shockwave
  const su = clamp(u / .9);
  if (su < 1) { ctx.globalAlpha = (1 - su) * .7; ctx.strokeStyle = '#ffdca0'; ctx.lineWidth = 3 + 10 * (1 - su); ctx.beginPath(); ctx.ellipse(c.x, c.y, LR * c.s * (1 + 4.5 * eo(su)), LR * c.s * (1 + 4.5 * eo(su)) * .92, 0, 0, 6.283); ctx.stroke(); }
  // sparks
  ctx.lineCap = 'round';
  SPK.forEach(s => {
    if (u > s.life) return; const k = 2.4, pos = tau => { const m = s.sp * (1 - Math.exp(-k * tau)) / k; return proj(s.d[0] * m, s.d[1] * m + 120 * tau * tau, s.d[2] * m); };
    const a = pos(u), b = pos(Math.max(0, u - .05)); if (!a || !b) return;
    ctx.globalAlpha = (1 - u / s.life) * .9; ctx.strokeStyle = '#ffe2a8'; ctx.lineWidth = s.w * a.s * 1.4;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(a.x, a.y); ctx.stroke();
  });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

const revealT = x => 5.45 + .85 * (x + TXT.width / 2) / TXT.width; // column x is solid text from revealT..+0.4s
function drawShards(t) {
  const A = 1; if (t < 3 || t > 7) return;
  const u = eo(clamp((t - 3) / 1.4)), drift = Math.max(0, t - 4.4) * .12;
  const out = [];
  SH.forEach(s => {
    const k = eio(clamp((t - 3.85 - s.delay) / 1.5));
    const b = [0, 1, 2].map(n => s.p0[n] + s.v[n] * (u + drift));
    const pos = [lerp(b[0], s.tx, k), lerp(b[1], s.ty, k), lerp(b[2], 0, k) - Math.sin(Math.PI * k) * 160 * s.bulge];
    const sp = 1 - k, ang = s.spin.map(a => a * u * sp + a * drift * sp);
    const vs = [0, 1, 2].map(i => { const l = [0, 1, 2].map(n => lerp(s.so[i][n], s.to[i][n], k)); const w = rotXYZ(l, ang[0], ang[1], ang[2]); return [w[0] + pos[0], w[1] + pos[1], w[2] + pos[2]]; });
    const ps = vs.map(v => proj(v[0], v[1], v[2])); if (ps.some(p => !p)) return;
    const n = norm(cross(sub(vs[1], vs[0]), sub(vs[2], vs[0]))), lit = Math.abs(dot(n, L));
    out.push({ ps, z: pos[2], col: ramp(lit * .8 + Math.pow(lit, 24) * .25), k, a: 1 - ss(.15, .4, (t - revealT(s.tx)) ) });
  });
  out.sort((a, b) => b.z - a.z);
  ctx.globalAlpha = A; ctx.lineWidth = .9; ctx.lineJoin = 'round';
  out.forEach(o => { if (o.a <= 0) return; ctx.globalAlpha = o.a; ctx.beginPath(); ctx.moveTo(o.ps[0].x, o.ps[0].y); ctx.lineTo(o.ps[1].x, o.ps[1].y); ctx.lineTo(o.ps[2].x, o.ps[2].y); ctx.closePath(); ctx.fillStyle = ctx.strokeStyle = o.col; ctx.fill(); ctx.stroke(); });
  ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 1;
  out.forEach(o => { if (o.k >= 1 || o.a <= 0) return; ctx.globalAlpha = o.a * .4 * (1 - o.k); ctx.strokeStyle = '#ffd890'; ctx.beginPath(); ctx.moveTo(o.ps[0].x, o.ps[0].y); ctx.lineTo(o.ps[1].x, o.ps[1].y); ctx.lineTo(o.ps[2].x, o.ps[2].y); ctx.closePath(); ctx.stroke(); });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; const tg2 = tmp.getContext('2d');
function goldGrad(g) {
  const gr = g.createLinearGradient(0, TXT.top, 0, TXT.bot);
  [[0, '#fff6d6'], [.16, '#f5d27a'], [.4, '#b07b22'], [.5, '#6b4410'], [.56, '#e9c063'], [.78, '#c9952f'], [1, '#7a4e12']].forEach(([o, c]) => gr.addColorStop(o, c));
  return gr;
}
const tx3 = document.createElement('canvas'); tx3.width = W; tx3.height = H; const tc = tx3.getContext('2d');
function drawText(t) {
  if (t < 5.4) return;
  const out = ctx; { tc.setTransform(1, 0, 0, 1, 0, 0); tc.clearRect(0, 0, W, H); }
  drawTextInto(tc, t);
  if (t < 6.7) {
    const p0 = proj(-TXT.width / 2, 0, 0), p1 = proj(TXT.width / 2, 0, 0), g = tc.createLinearGradient(p0.x, 0, p1.x, 0);

}
function drawTextInto(ctx, t) {
  const set = (g, p) => g.setTransform(p.s, 0, 0, p.s, p.x, p.y);

  for (let k = 14; k >= 1; k--) { const p = proj(0, 0, k * 5); set(ctx, p); const m = 1 - k / 14; ctx.fillStyle = `rgb(${Math.round(lerp(28, 120, m))},${Math.round(lerp(16, 78, m))},${Math.round(lerp(4, 18, m))})`; textPath(ctx); }

}
function drawTextFx(t) {
  const set = (g, p) => g.setTransform(p.s, 0, 0, p.s, p.x, p.y), p = proj(0, 0, 0);
  // lock-in flash + shine sweep, clipped to letters

    tg2.globalCompositeOperation = 'source-in';

    if (sw > 0 && sw < 1) {

      const gr = tg2.createLinearGradient(bx - 160, 0, bx + 160, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,250,230,.75)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

}

function drawFlare(t) {
  const I = ss(7.0, 7.6, t) * (1 - .58 * ss(7.7, 8.7, t)); if (I <= 0) return;
  const k = eio(ss(7.0, 8.5, t));
  const ax = TXT.xs[3] + TXT.ws[3] / 2, wx = lerp(TXT.xs[0] + 20, ax, k) + (t - 8.5 > 0 ? (t - 8.5) * 6 : 0);
  const p = proj(wx, TXT.top + 6, -10);
  ctx.globalCompositeOperation = 'lighter';
  let r = 110 * I + 40; ctx.globalAlpha = I; ctx.drawImage(glowW, p.x - r, p.y - r, r * 2, r * 2);
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(1, .016); ctx.globalAlpha = .55 * I; ctx.drawImage(glowB, -1100, -1100, 2200, 2200); ctx.restore();
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(1, .03); ctx.globalAlpha = .45 * I; ctx.drawImage(glowW, -420, -420, 840, 840); ctx.restore();
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(t * .15); ctx.strokeStyle = 'rgba(255,235,200,1)'; ctx.lineWidth = 1;

  ctx.restore();

  [[.45, 26, 'rgba(120,220,210,1)', .10], [.8, 60, 'rgba(255,170,90,1)', .06], [1.3, 18, 'rgba(160,190,255,1)', .12], [1.65, 90, 'rgba(120,200,190,1)', .05], [2.1, 38, 'rgba(255,200,120,1)', .07]].forEach(([m, rad, col, a]) => {
    const gx = p.x + vx * m, gy = p.y + vy * m; const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad);
    g.addColorStop(0, col.replace(',1)', ',.0)')); g.addColorStop(.7, col.replace(',1)', ',.5)')); g.addColorStop(1, col.replace(',1)', ',0)'));

}

function drawBg(t) {
  ctx.fillStyle = '#04050a'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1150);
  const warm = ss(6.4, 7.6, t) * .5;
  g.addColorStop(0, `rgba(${Math.round(16 + 30 * warm)},${Math.round(20 + 14 * warm)},${Math.round(34 - 6 * warm)},1)`); g.addColorStop(1, 'rgba(4,5,10,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawPost(t) {
  const v = ctx.createRadialGradient(CX, CY, 420, CX, CY, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.78)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const f = Math.round(t * 30), gi = grain[f % 4], ox = (f * 137) % 512, oy = (f * 251) % 512;
  ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay';
  for (let y = -oy; y < H; y += 512) for (let x = -ox; x < W; x += 512) ctx.drawImage(gi, x, y);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  if (t < .4) { ctx.fillStyle = `rgba(0,0,0,${1 - ss(0, .4, t)})`; ctx.fillRect(0, 0, W, H); }
}

window.draw = t => {
  setCam(t); ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawBg(t);
  drawFog(t, false); drawDust(t, false);
  if (t < 3) drawLogo(t);
  drawShards(t); drawText(t); drawBurst(t);
  drawFlare(t);
  drawDust(t, true); drawFog(t, true);
  drawPost(t);
};
window.ready = document.fonts.load(`700 100px Bahnschrift`).then(() => { layoutText(); buildShards(); window.draw(0); return SH.length; });
