name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma generate/validate only need the variables to exist; CI never touches Supabase.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        working-directory: apps/api
      - run: npm run db:generate -w @trabawho/api
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:catalog
      # Model-free baseline: keeps the pipeline + eval script from silently breaking.
      - run: npm run eval -- --backend keywords

  android-bundle:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Catches Metro / NativeWind / import errors without a native build.
      - run: npx expo export --platform android --output-dir /tmp/export
        working-directory: apps/mobile
        env:
          CI: "1"

  # Optional: manual EAS APK build. Needs EXPO_TOKEN secret + apps/mobile/eas.json (see docs/TASKS.md section 5).
